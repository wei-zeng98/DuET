[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "duet-score"
version = "0.1.0"
description = "Dual-stream piano performance MIDI to score inference"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3", "mido>=1.3,<2", "safetensors>=0.4,<1", "huggingface-hub>=0.25,<2", "pandas>=2,<4", "scipy>=1.11,<2"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Multimedia :: Sound/Audio :: MIDI", "Development Status :: 3 - Alpha"]

[project.optional-dependencies]
audio = ["transkun==2.0.1"]
test = ["music21>=9,<10"]

[project.scripts]
duet = "duet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
duet = ["vocabulary.json", "readable/README.md"]
